name: Forecast bot - test

# Manual smoke test. Runs the offline tests, checks the configured model IDs
# exist on OpenRouter, then forecasts on Metaculus's unscored bot-testing-area.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Post forecasts to the (unscored) bot-testing-area"
        type: boolean
        default: true

concurrency:
  group: forecast-bot-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: forecast-bot
    # Secrets are passed only to the steps that need them (never to the
    # third-party setup actions).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: forecast-bot/.venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('forecast-bot/poetry.lock') }}
      - run: poetry install --no-interaction --no-root
      - name: Detect configured secrets
        id: has
        env:
          METACULUS: ${{ secrets.METACULUS_TOKEN != '' }}
          CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          MODEL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' || secrets.OPENROUTER_API_KEY != '' }}
        run: |
          echo "metaculus=$METACULUS" >> "$GITHUB_OUTPUT"
          echo "claude=$CLAUDE" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
      - name: Install Claude Code CLI
        if: steps.has.outputs.claude == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.293
      - name: Claude Code smoke test (each configured credential)
        if: steps.has.outputs.claude == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "API-credits key:"; echo "Reply with exactly OK" | env -u CLAUDE_CODE_OAUTH_TOKEN claude -p --tools "" --max-turns 1 --model haiku
          fi
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Subscription token:"; echo "Reply with exactly OK" | env -u ANTHROPIC_API_KEY claude -p --tools "" --max-turns 1 --model haiku
          fi
      - name: Offline unit tests
        run: poetry run python -m unittest test_run test_cli_llm test_mc -v
      - name: Check configured model IDs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
        run: poetry run python scripts/check_models.py
      - name: Price sheet (for cost modelling)
        run: poetry run python scripts/check_models.py --list
      - name: Live read-only check of mc.py (the Metaculus API requires a token)
        if: steps.has.outputs.metaculus == 'true'
        continue-on-error: true
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION }}
          TOURNAMENT_ID: ${{ vars.TOURNAMENT_ID }}
          MINIBENCH_ID: ${{ vars.MINIBENCH_ID }}
        run: |
          poetry run python mc.py pending --tournament main --max 3 | head -c 4000
          poetry run python mc.py pending --tournament test --max 3 | head -c 3000
      - name: Forecast on bot-testing-area
        if: steps.has.outputs.metaculus == 'true' && steps.has.outputs.model == 'true'
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION }}
          TOURNAMENT_ID: ${{ vars.TOURNAMENT_ID }}
          MINIBENCH_ID: ${{ vars.MINIBENCH_ID }}
        run: poetry run python run.py --mode test_questions ${{ !inputs.publish && '--dry-run' || '' }}
