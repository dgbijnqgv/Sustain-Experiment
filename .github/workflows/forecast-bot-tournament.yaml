name: Forecast bot - tournament

# Tournament questions are normally open for only ~1.5 hours, so the bot must
# run often and reliably:
# - GitHub's own schedule (every 30 min) is the baseline, but GitHub can delay
#   or drop scheduled runs under load.
# - For reliability, an external scheduler (e.g. cron-job.org) should call
#   this workflow's workflow_dispatch every 15 minutes. See PLAN.md §8.
# The concurrency group serializes overlapping runs, and already-answered
# questions are skipped, so extra triggers never double-forecast.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: forecast-bot-tournament
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    # Off until the owner sets the repository variable BOT_ENABLED=true (skipped
    # jobs cost no Actions minutes); set it to anything else to pause the bot.
    if: vars.BOT_ENABLED == 'true'
    defaults:
      run:
        working-directory: forecast-bot
    steps:
      - name: Skip until secrets are configured
        id: ready
        working-directory: .
        env:
          HAS_METACULUS: ${{ secrets.METACULUS_TOKEN != '' }}
          HAS_MODEL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' || secrets.OPENROUTER_API_KEY != '' }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_METACULUS" = "true" ] && [ "$HAS_MODEL" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "claude=$HAS_CLAUDE" >> "$GITHUB_OUTPUT"
          else
            echo "METACULUS_TOKEN and a model credential (CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY or OPENROUTER_API_KEY) not set yet; nothing to do."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ok == 'true'
        id: py
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        if: steps.ready.outputs.ok == 'true'
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Restore cached venv
        if: steps.ready.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: forecast-bot/.venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('forecast-bot/poetry.lock') }}
      - name: Install dependencies
        if: steps.ready.outputs.ok == 'true'
        run: poetry install --no-interaction --no-root
      - name: Install Claude Code CLI
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.claude == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.293
      # Secrets are exposed only to this step, not to third-party setup actions.
      - name: Forecast on open tournament questions
        if: steps.ready.outputs.ok == 'true'
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION }}
          TOURNAMENT_ID: ${{ vars.TOURNAMENT_ID }}
          MINIBENCH_ID: ${{ vars.MINIBENCH_ID }}
          # MiniBench roughly doubles forecasting minutes, beyond the private-repo
          # allowance; enable (vars.RUN_MINIBENCH=true) in a public bot repo or
          # with a GitHub payment method and spending limit.
          RUN_MINIBENCH: ${{ vars.RUN_MINIBENCH || 'false' }}
        run: poetry run python run.py --mode tournament
