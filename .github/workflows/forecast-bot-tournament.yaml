name: Forecast bot - tournament

# Every 30 minutes, offset off the hour. Tournament questions are normally open
# for only ~1.5 hours, so this gives each question about three chances even
# when GitHub delays scheduled runs, while staying inside the private-repo
# allowance of 2,000 Actions minutes a month (a 20-minute cron would exceed it).
# For extra reliability, an external scheduler may also call workflow_dispatch;
# the concurrency group serializes overlapping runs.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: forecast-bot-tournament
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    # Off until the owner sets the repository variable BOT_ENABLED=true (skipped
    # jobs cost no Actions minutes); set it to anything else to pause the bot.
    if: vars.BOT_ENABLED == 'true'
    defaults:
      run:
        working-directory: forecast-bot
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
      ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
      RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
      PARSER_MODEL: ${{ vars.PARSER_MODEL }}
      REASONING_EFFORT: ${{ vars.REASONING_EFFORT }}
      PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION }}
      MAX_COST_PER_RUN_USD: ${{ vars.MAX_COST_PER_RUN_USD }}
      # MiniBench roughly doubles forecasting minutes, which would exceed the
      # private-repo allowance; enable it (vars.RUN_MINIBENCH=true) once the repo
      # is public or has a payment method with a spending limit.
      RUN_MINIBENCH: ${{ vars.RUN_MINIBENCH || 'false' }}
    steps:
      - name: Skip until secrets are configured
        id: ready
        working-directory: .
        run: |
          if [ -n "$METACULUS_TOKEN" ] && { [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; }; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "METACULUS_TOKEN and a model credential (CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY or OPENROUTER_API_KEY) not set yet; nothing to do."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ok == 'true'
        id: py
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        if: steps.ready.outputs.ok == 'true'
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Restore cached venv
        if: steps.ready.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: forecast-bot/.venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('forecast-bot/poetry.lock') }}
      - name: Install dependencies
        if: steps.ready.outputs.ok == 'true'
        run: poetry install --no-interaction --no-root
      - name: Install Claude Code CLI (subscription backend)
        if: steps.ready.outputs.ok == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.293
      - name: Forecast on open tournament and MiniBench questions
        if: steps.ready.outputs.ok == 'true'
        run: poetry run python run.py --mode tournament
